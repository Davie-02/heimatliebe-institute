<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Heimatliebe Institute · Language school in Karonga, Malawi</title>
    <meta name="description" content="Heimatliebe Institute: German and other foreign language courses in Karonga, Malawi. Free placement test, online applications, student portal and official exam registration." />
    <meta name="theme-color" content="#1b4332" />
    <meta property="og:title" content="Heimatliebe Institute" />
    <meta property="og:description" content="Foreign language skills that open doors to education, employment and the world." />
    <meta property="og:image" content="/img/icon-512.png" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png" />
    <link rel="apple-touch-icon" href="/img/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/img/icons.svg" as="image" type="image/svg+xml" />
    <script>
      // Apply the saved light/dark choice before the first paint, so the page never flashes.
      try {
        var t = localStorage.getItem("hml_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* Shown while the app's code downloads on a slow connection. */
      #boot { min-height: 100vh; display: grid; place-items: center; background: #1b4332; }
      #boot img { width: 72px; height: 72px; border-radius: 18px; background: #fff; padding: 6px; animation: boot 1.2s ease-in-out infinite; }
      @keyframes boot { 50% { opacity: 0.55; transform: scale(0.96); } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><img src="/img/logo.webp" alt="Heimatliebe Institute" width="72" height="72" /></div></div>
    <noscript>Please turn on JavaScript to use the Heimatliebe Institute website, or call +265 991 383 466.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
