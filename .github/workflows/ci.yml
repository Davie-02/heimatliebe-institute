# Runs the test suite on every push and pull request to `staging` and `main`.
# Render only deploys what you push; protect `main` so changes must pass here first (see README).
name: Tests
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: find public -name "*.js" -print0 | xargs -0 -n1 node --check
