# Checks every push and pull request to `staging` and `main`: the API's tests against a real
# PostgreSQL, type checks, and a production build of the website. Deploys only happen from what
# you push, so merge into `main` only when this is green.
name: Tests
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heimatliebe
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/heimatliebe
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/heimatliebe
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-tests-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
